service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  baseline_p95_ms: 152
  baseline_ttft_p95_ms: 50
  example_total_requests: 10000
  example_allowed_bad_requests: 50
  note: >-
    CP0 local baseline có P95 152 ms và TTFT P95 50 ms trên 10 request.
    Chọn ngưỡng 3000 ms để phát hiện request chậm rõ rệt và giữ cùng ngưỡng
    với dashboard/alert. Trong 28 ngày, SLO 99.5% cho phép 0.5% request
    lỗi hoặc vượt 3000 ms; 10000 request tương ứng tối đa 50 request xấu.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
